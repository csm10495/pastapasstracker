name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The app ships straight from the repository, so a broken commit would be a
  # broken deployment. Tests gate the publish.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run unit and functional tests
        # ubuntu-latest ships Chrome, which the functional tests drive over the
        # DevTools Protocol. There are no dependencies to install.
        env:
          PPT_CHROME: /usr/bin/google-chrome
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Record commit hash
        run: git rev-parse HEAD > commit_hash.txt

      - name: Record build date
        run: date -u +"%Y-%m-%d %H:%M UTC" > build_date.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically rather than failing the first deploy of
          # a fresh repository with a bare "Not Found".
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
